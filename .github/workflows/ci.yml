name: NexusOne CI

on:
  push:
    branches: [main, nexusone-foundation, nexusone-lan-deployment]
  pull_request:
    branches: [main, nexusone-foundation]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile deployment installer
        run: python -m py_compile deploy/integrate_legacy_dashboard.py nexusone/dashboard_installer.py
      - name: Check deployment script syntax
        run: bash -n deploy/setup_lan_proxy.sh
      - name: Run tests
        run: python -m pytest
      - name: Lint
        run: ruff check nexusone tests
